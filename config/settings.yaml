# ============================================================
# LEGEND TRADING AI — SETTINGS
# ============================================================

app:
  name: "Legend Trading AI"
  version: "0.1.0"
  timezone: "UTC"

# ------------------------------------------------------------
# REPORTING
# ------------------------------------------------------------
reporting:
  interval_hours: 5
  daily_summary_hour: 23

# ------------------------------------------------------------
# SIGNAL THRESHOLDS
# ------------------------------------------------------------
signals:
  strong_confidence_min: 0.70
  weak_confidence_min: 0.55
  entry_window_minutes: 15

# ------------------------------------------------------------
# RISK
# ------------------------------------------------------------
risk:
  max_signals_per_day: 10
  cooldown_minutes_per_symbol: 15
  max_open_trades: 3
  daily_loss_limit_pct: 2.0

# ------------------------------------------------------------
# MODEL
# ------------------------------------------------------------
model:
  champion_version: "v0.1"
  registry_path: "models/registry.json"
  mode: "paper"

# ============================================================
# DATA ENGINE
# ============================================================
# Everything the downloader uses. Change values here to
# change behavior. Never hard-code in the notebook.
# ============================================================

data:
  # Target history (may be less if provider lacks it)
  target_historical_years: 5

  # Timeframes to download (full multi-timeframe architecture)
  timeframes:
    - "5m"
    - "15m"
    - "1h"
    - "4h"
    - "1d"

  # Where to save locally (Colab) and in Drive
  output_dir: "data/raw"
  checkpoint_file: "data/download_checkpoint.json"
  summary_file: "data/download_summary.csv"

  # Rate limit behavior — never assumed, always measured
  rate_limit:
    min_delay_between_requests: 0.25   # seconds; conservative floor
    max_retries: 5
    backoff_base_seconds: 2            # exponential backoff on failure
    respect_retry_after: true          # honor HTTP 429 Retry-After

  # Data quality rules
  quality:
    max_gap_hours:
      "5m": 2
      "15m": 4
      "1h": 6
      "4h": 12
      "1d": 72
    min_bars_required:
      "5m": 50000
      "15m": 20000
      "1h": 10000
      "4h": 3000
      "1d": 500
    reject_if_duplicate_rows: true
    reject_if_ohlc_invalid: true

# ============================================================
# MARKET UNIVERSE
# ============================================================
# Discovery-driven. The engine finds eligible markets.
# ============================================================

market_discovery:
  enabled: true

  # Base list to check (engine may add from Binance discovery)
  seed_symbols:
    - BTC/USDT
    - ETH/USDT
    - SOL/USDT
    - BNB/USDT
    - XRP/USDT
    - ADA/USDT
    - DOGE/USDT
    - AVAX/USDT
    - LINK/USDT
    - DOT/USDT
    - LTC/USDT
    - ATOM/USDT
    - NEAR/USDT
    - ARB/USDT
    - OP/USDT
    - MATIC/USDT
    - INJ/USDT
    - SUI/USDT
    - APT/USDT
    - FIL/USDT

  # Requirements a symbol must meet to be eligible
  filters:
    require_spot_market: true
    require_active_status: true
    min_quote_volume_24h_usdt: 5_000_000      # $5M daily minimum
    min_history_years: 1                        # at least 1 year
    require_usdt_quote: true                    # we work in USDT pairs
    exclude_stablecoins: true
    exclude_wrapped_tokens: true

  # Selection
  maximum_symbols: 30          # soft ceiling, not a hard limit
  rank_by: "quote_volume_24h"  # or "market_cap_approx"

# ------------------------------------------------------------
# Asset classes (for future expansion)
# ------------------------------------------------------------
# ------------------------------------------------------------
# ASSET CLASSES
# ------------------------------------------------------------
# Only crypto is enabled now. The rest are documented but
# disabled until their data pipelines are built.
# ------------------------------------------------------------

markets:

  # ==========================================================
  # CRYPTO — ENABLED
  # ==========================================================
  crypto:
    enabled: true
    discover_additional_symbols: true
    data_source: "binance_public"     # free, no API key
    note: "Primary asset class. Binance public data."

  # ==========================================================
  # FOREX — PLANNED
  # ==========================================================
  forex:
    enabled: false                    # ← flip to true when ready
    note: "Enable after crypto pipeline is proven."
    planned_providers:
      - dukascopy     # historical (bulk download, free)
      - twelvedata    # live (800 calls/day free tier)
      - yahoo         # backup
    planned_symbols:
      # Majors
      - EURUSD
      - GBPUSD
      - USDJPY
      - USDCHF
      - AUDUSD
      - USDCAD
      - NZDUSD
      # Crosses
      - EURGBP
      - EURJPY
      - GBPJPY
      # Commodities (FX-style)
      - XAUUSD    # gold
      - XAGUSD    # silver
    note_sessions: |
      Forex sessions (UTC):
        Tokyo:   00:00 – 09:00
        London:  07:00 – 16:00
        New York: 12:00 – 21:00
        London/NY overlap (12:00–16:00): best liquidity

  # ==========================================================
  # STOCKS — PLANNED
  # ==========================================================
  stocks:
    enabled: false
    note: "Requires reliable data provider (Polygon/Alpaca)."

  # ==========================================================
  # INDICES — PLANNED
  # ==========================================================
  indices:
    enabled: false
    note: "Requires reliable data provider."

  # ==========================================================
  # COMMODITIES — PLANNED
  # ==========================================================
  commodities:
    enabled: false
    note: "Requires reliable data provider."

  # ==========================================================
  # FUTURES — LATER
  # ==========================================================
  futures:
    enabled: false
    note: "CME data is expensive. Deferred."

  # ==========================================================
  # ETFs — LATER
  # ==========================================================
  etfs:
    enabled: false
    note: "Requires reliable data provider."

  # ==========================================================
  # OTC — NEVER (by design)
  # ==========================================================
  otc:
    enabled: false
    note: "Never auto-trust OTC. Requires verified exact-instrument feed."
