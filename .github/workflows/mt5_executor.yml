name: MT5 Executor

on:
  schedule:
    - cron: '*/15 * * * *' # Runs every 15 minutes
  workflow_dispatch: # Allows manual trigger

jobs:
  execute-trades:
    runs-on: windows-latest # MT5 requires Windows

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install MT5 Terminal
        shell: powershell
        run: |
          $installerPath = "$env:TEMP\mt5setup.exe"
          $downloadUrl = "https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe"
          Invoke-WebRequest -Uri $downloadUrl -OutFile $installerPath
          Start-Process -FilePath $installerPath -ArgumentList "/auto" -Wait
          Write-Host "MT5 installation completed."

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install MetaTrader5 psycopg2-binary python-dotenv

      - name: Run MT5 Worker
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          MT5_LOGIN: ${{ secrets.MT5_LOGIN }}
          MT5_PASSWORD: ${{ secrets.MT5_PASSWORD }}
          MT5_SERVER: ${{ secrets.MT5_SERVER }}
        run: python mt5_worker.py
