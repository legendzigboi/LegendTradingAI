name: MT5 Executor via Docker Bridge

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  execute-trades:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Start MT5 Bridge Container
        run: |
          docker pull liberatti/mt5bridge:latest
          docker run -d --name mt5bridge \
            -p 5000:5000 \
            -e MT5_LOGIN="${{ secrets.MT5_LOGIN }}" \
            -e MT5_PASSWORD="${{ secrets.MT5_PASSWORD }}" \
            -e MT5_SERVER="${{ secrets.MT5_SERVER }}" \
            liberatti/mt5bridge:latest
          echo "Waiting for MT5 Bridge to be ready..."
          sleep 30

      - name: Verify Bridge is Running
        run: |
          curl -s http://localhost:5000/ | head -n 1

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests psycopg2-binary python-dotenv

      - name: Run MT5 Worker (via REST API)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          MT5_BRIDGE_URL: http://localhost:5000
        run: python mt5_worker.py
