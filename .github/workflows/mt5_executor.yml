name: MT5 Executor

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  execute-trades:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Start MT5 Bridge Container
        env:
          LOGIN: ${{ secrets.MT5_LOGIN }}
          PASS: ${{ secrets.MT5_PASSWORD }}
          SERV: ${{ secrets.MT5_SERVER }}
        run: |
          docker pull liberatti/mt5bridge:latest
          docker run -d --name mt5bridge -p 5000:5000 -e MT5_LOGIN="$LOGIN" -e MT5_PASSWORD="$PASS" -e MT5_SERVER="$SERV" -e SECURITY_ENABLED=false liberatti/mt5bridge:latest
          echo "Waiting for MT5 Bridge to boot..."
          sleep 30

      - name: Wait for MT5 Bridge to be Ready
        run: |
          echo "Waiting for MT5 Bridge to boot (up to 120 seconds)..."
          for i in {1..12}; do
            if curl -s http://localhost:5000/api/account_info > /dev/null; then
              echo "✅ MT5 Bridge is UP!"
              exit 0
            fi
            echo "Attempt $i/12 failed. Waiting 10 seconds..."
            sleep 10
          done
          
          echo "❌ MT5 Bridge failed to start. Dumping Docker Logs:"
          docker logs mt5bridge
          exit 1

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests psycopg2-binary python-dotenv

      - name: Run MT5 Worker (via REST API)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          MT5_BRIDGE_URL: http://localhost:5000/api
        run: python mt5_worker.py
