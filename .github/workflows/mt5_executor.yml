name: MT5 Executor

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  execute-trades:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Start MT5 VNC Container
        env:
          LOGIN: ${{ secrets.MT5_LOGIN }}
          PASS: ${{ secrets.MT5_PASSWORD }}
          SERV: ${{ secrets.MT5_SERVER }}
        run: |
          docker pull gmag11/metatrader5_vnc:2.3
          # 🚨 Start the VNC container. Port 3000 is for the VNC web interface, 8001 is for RPyC.
          docker run -d --name mt5vnc \
            -p 3000:3000 \
            -p 8001:8001 \
            -e MT5_LOGIN="$LOGIN" \
            -e MT5_PASSWORD="$PASS" \
            -e MT5_SERVER="$SERV" \
            gmag11/metatrader5_vnc:2.3

      - name: Wait for MT5 VNC to be Ready
        run: |
          echo "Waiting for MT5 VNC to boot..."
          sleep 60
          echo "Checking VNC endpoint..."
          curl -s http://localhost:3000/ | head -n 1

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install rpyc psycopg2-binary python-dotenv

      - name: Run MT5 Worker (via RPyC)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python mt5_worker.py
