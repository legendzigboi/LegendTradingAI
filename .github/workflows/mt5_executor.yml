name: MT5 Executor (Native Windows)

on:
  schedule:
    - cron: '3,18,33,48 * * * *'
  workflow_dispatch:

jobs:
  execute-trades:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install MT5 Terminal (Portable Mode)
        shell: powershell
        run: |
          Write-Host "Downloading MT5..."
          $installerPath = "$env:TEMP\mt5setup.exe"
          $downloadUrl = "https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe"
          Invoke-WebRequest -Uri $downloadUrl -OutFile $installerPath
          
          Write-Host "Installing MT5 silently in portable mode..."
          # 🚨 The /portable flag is crucial 🚨
          Start-Process -FilePath $installerPath -ArgumentList "/auto /portable" -Wait
          
          Write-Host "Verifying installation..."
          if (Test-Path "C:\Program Files\MetaTrader 5\terminal64.exe") {
              Write-Host "✅ MT5 installed successfully."
          } else {
              Write-Error "❌ MT5 installation failed."
          }

      - name: Force Enable Algo Trading in Config
        shell: powershell
        run: |
          Write-Host "Writing common.ini to force Algo Trading..."
          $configDir = "C:\Program Files\MetaTrader 5\config"
          if (!(Test-Path $configDir)) { New-Item -ItemType Directory -Force -Path $configDir }
          
          $iniContent = @"
          [Common]
          Login=${{ secrets.MT5_LOGIN }}
          Password=${{ secrets.MT5_PASSWORD }}
          Server=${{ secrets.MT5_SERVER }}
          [Experts]
          AllowLiveTrading=1
          AllowDllImport=1
          Enabled=1
          Account=${{ secrets.MT5_LOGIN }}
          Server=${{ secrets.MT5_SERVER }}
          "@
          $iniContent | Out-File -FilePath "$configDir\common.ini" -Encoding ASCII
          Write-Host "✅ common.ini created."

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install MetaTrader5 psycopg2-binary python-dotenv

      - name: Run MT5 Worker (Native Windows)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          MT5_LOGIN: ${{ secrets.MT5_LOGIN }}
          MT5_PASSWORD: ${{ secrets.MT5_PASSWORD }}
          MT5_SERVER: ${{ secrets.MT5_SERVER }}
        run: python mt5_worker.py
