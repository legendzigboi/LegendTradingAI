name: MT5 Executor (Linux + Wine + Patch)

on:
  workflow_dispatch:

jobs:
  execute-trades:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y wine wine32 wine64 xvfb python3-pip winetricks curl

      - name: Initialize Wine and Xvfb
        run: |
          Xvfb :99 -screen 0 1024x768x24 &
          export DISPLAY=:99
          export WINEPREFIX=$HOME/.wine
          export WINEDEBUG=-all

          wineboot --init
          echo "Waiting for Wine to settle..."
          sleep 10
          
          # 🚨 Install missing Windows dependencies 🚨
          winetricks -q corefonts vcrun2019

      - name: Install MT5 via Wine
        run: |
          set -x # 🚨 Print every command before executing
          export DISPLAY=:99
          export WINEPREFIX=$HOME/.wine
          export WINEDEBUG=-all

          # Use curl to download and show errors
          curl -L -o mt5setup.exe https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe
          
          # Try running the installer
          wine mt5setup.exe /auto
          
          echo "Waiting for MT5 to install..."
          sleep 15
          
          echo "--- Listing MT5 Directory ---"
          ls -la "$HOME/.wine/drive_c/Program Files/MetaTrader 5/" || echo "Directory not found"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install MetaTrader5 psycopg2-binary python-dotenv

      - name: Run MT5 Diagnostic
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          MT5_LOGIN: ${{ secrets.MT5_LOGIN }}
          MT5_PASSWORD: ${{ secrets.MT5_PASSWORD }}
          MT5_SERVER: ${{ secrets.MT5_SERVER }}
        run: |
          export DISPLAY=:99
          export WINEPREFIX=$HOME/.wine
          export WINEDEBUG=-all
          python mt5_worker.py
