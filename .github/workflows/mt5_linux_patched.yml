name: MT5 Executor (Linux + Wine + Patch)

on:
  workflow_dispatch: # ONLY manual for now

jobs:
  execute-trades:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y wine wine32 wine64 xvfb python3-pip winetricks

      - name: Install MT5 via Wine
        run: |
          wget -q https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe
          export WINEPREFIX=$HOME/.wine
          export WINEDEBUG=-all
          xvfb-run wine mt5setup.exe /auto
          echo "Waiting for MT5 to settle..."
          sleep 10
          
          echo "--- File listing of MT5 directory ---"
          find $HOME/.wine/drive_c/Program\ Files/MetaTrader\ 5/ || echo "Directory not found!"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install MetaTrader5 psycopg2-binary python-dotenv

      - name: Run MT5 Diagnostic
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          MT5_LOGIN: ${{ secrets.MT5_LOGIN }}
          MT5_PASSWORD: ${{ secrets.MT5_PASSWORD }}
          MT5_SERVER: ${{ secrets.MT5_SERVER }}
        run: |
          export WINEPREFIX=$HOME/.wine
          export WINEDEBUG=-all
          echo "--- Starting Xvfb and running Python ---"
          xvfb-run python mt5_worker.py
# Force refresh
