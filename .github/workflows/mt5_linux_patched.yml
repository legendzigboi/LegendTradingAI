name: MT5 Executor (Linux + Wine + Patch)

on:
  workflow_dispatch:

jobs:
  execute-trades:
    runs-on: ubuntu-latest
    timeout-minutes: 15 # Give it enough time

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y wine wine32 wine64 xvfb python3-pip winetricks

      - name: Initialize Wine and Xvfb
        run: |
          # Start Xvfb manually on display :99
          Xvfb :99 -screen 0 1024x768x24 &
          export DISPLAY=:99
          export WINEPREFIX=$HOME/.wine
          export WINEDEBUG=-all

          # Initialize the Wine prefix
          wineboot --init
          echo "Waiting for Wine to settle..."
          sleep 10

      - name: Install MT5 via Wine
        run: |
          export DISPLAY=:99
          export WINEPREFIX=$HOME/.wine
          export WINEDEBUG=-all

          wget -q https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe
          
          # Run the installer
          wine mt5setup.exe /auto
          
          echo "Waiting for MT5 to install..."
          sleep 15
          
          # 🚨 DIAGNOSTIC: Check if MT5 files exist
          echo "--- Listing MT5 Directory ---"
          ls -la "$HOME/.wine/drive_c/Program Files/MetaTrader 5/"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install MetaTrader5 psycopg2-binary python-dotenv

      - name: Run MT5 Diagnostic
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          MT5_LOGIN: ${{ secrets.MT5_LOGIN }}
          MT5_PASSWORD: ${{ secrets.MT5_PASSWORD }}
          MT5_SERVER: ${{ secrets.MT5_SERVER }}
        run: |
          export DISPLAY=:99
          export WINEPREFIX=$HOME/.wine
          export WINEDEBUG=-all
          python mt5_worker.py
