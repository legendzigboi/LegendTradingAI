name: MT5 Executor (Linux + Wine + Patch)

on:
  workflow_dispatch:

jobs:
  execute-trades:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y wine wine32 wine64 xvfb python3-pip winetricks curl

      - name: Initialize Wine and Xvfb
        run: |
          # Start virtual display
          Xvfb :99 -screen 0 1024x768x24 &
          echo "Waiting for Xvfb..."
          sleep 2
          
          # Initialize 64-bit Wine prefix
          export WINEARCH=win64
          export WINEPREFIX=$HOME/.wine
          wineboot --init
          sleep 5

      - name: Install MT5 via Wine (Diagnostic)
        shell: bash
        env:
          DISPLAY: ":99"
          WINEPREFIX: /home/runner/.wine
          WINEARCH: win64
        run: |
          set -e
          echo "=== Wine version ==="
          wine --version

          echo "=== Download Installer ==="
          curl -fL --retry 3 -o mt5setup.exe https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe
          file mt5setup.exe

          echo "=== Run MT5 installer ==="
          # Capture output to log file and show it if it fails
          timeout 600s wine mt5setup.exe /auto > mt5-install.log 2>&1 || {
            echo "❌ MT5 installation failed. Showing last 100 lines of log:"
            tail -n 100 mt5-install.log
            exit 1
          }

          echo "=== Search for installed terminal ==="
          find "$WINEPREFIX/drive_c" -iname "terminal64.exe" -o -iname "terminal.exe" 2>/dev/null || true

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install MetaTrader5 psycopg2-binary python-dotenv

      - name: Run MT5 Diagnostic
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          MT5_LOGIN: ${{ secrets.MT5_LOGIN }}
          MT5_PASSWORD: ${{ secrets.MT5_PASSWORD }}
          MT5_SERVER: ${{ secrets.MT5_SERVER }}
          DISPLAY: ":99"
          WINEPREFIX: /home/runner/.wine
          WINEARCH: win64
        run: |
          python mt5_worker.py
